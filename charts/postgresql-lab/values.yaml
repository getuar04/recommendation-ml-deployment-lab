# Chart-local defaults. The lab deploy overrides these via
# `--values deploy/datastores/postgresql-values-lab.yaml`; these defaults only make
# `helm lint`/`helm template` produce a sane render on their own.

fullnameOverride: rms-lab-postgres

image:
  registry: docker.io
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

replicaCount: 1

postgresql:
  database: recommendation_lab
  username: rms_lab
  # Password is NEVER set here -- always read from this existing Secret's key at deploy
  # time. The Secret is created out of band (kubectl create secret), never by this chart.
  existingSecret: rms-lab-db
  passwordKey: DATABASE_PASSWORD

persistence:
  storageClass: hostpath
  size: 8Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  ports:
    postgresql: 5432
